<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 258" width="190" height="258" role="img">
  <title>CUT首件/巡迴檢驗單 尺寸位置</title>
  <desc>Redrawn from the shapes of CUT-首件巡迴檢驗單.xlsx at their positions in points, checked against the workbook's drawing XML: a C-type core from above with its side, dimensioned E, B, A, C and D, and a toroidal core from above with its side, dimensioned C1, B1, A, D, B2 and C2.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8z" fill="#000" />
    </marker>
  </defs>
  <g fill="none" stroke="#000" stroke-width="1">
    <!-- C型: the core from above, its window, and its side. -->
    <rect x="42.5" y="37.2" width="104.2" height="59.2" rx="10" ry="10" />
    <rect x="62.8" y="50.8" width="64.5" height="31.5" />
    <rect x="162.5" y="37.2" width="21" height="53.2" />
    <!-- Extension lines. -->
    <path d="M42.5 22.2V102.4M95.8 22.2V50.7M16.2 82.2H95.7M16.2 96.5H95.7M62.8 66.5V109.3M128.8 77.8V110" />
    <!-- 環型: the core from above, its bore, and its side. -->
    <ellipse cx="82.25" cy="159.8" rx="29.25" ry="27.4" />
    <ellipse cx="82.6" cy="161" rx="16.1" ry="15" />
    <rect x="121.2" y="134.8" width="21.8" height="58.5" />
    <path d="M9.5 132.5H89M8 188H86.8M66.5 180.5V212.7M98.8 179V215M53 158.8V227.8M110.8 160.2V227.7" />
  </g>
  <g fill="none" stroke="#000" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <!-- C型: E across the outside, B inside the window, A the wall, C the window, D the side. -->
    <line x1="42.5" y1="26.8" x2="95.7" y2="26.8" />
    <line x1="95.8" y1="51.5" x2="95.8" y2="82.3" />
    <line x1="32" y1="82.2" x2="32" y2="96.4" />
    <line x1="62.8" y1="103.5" x2="127.3" y2="103.5" />
    <line x1="162.5" y1="68" x2="183.5" y2="68" />
    <!-- 環型: C1 the height, B1 the bore, D the side, B2 and C2 across. -->
    <line x1="33.9" y1="132.5" x2="33.9" y2="188" />
    <line x1="82.2" y1="146" x2="82.2" y2="176" />
    <line x1="121.2" y1="174.5" x2="143" y2="174.5" />
    <line x1="67.2" y1="192.5" x2="99.4" y2="192.5" />
    <line x1="53.8" y1="217.2" x2="112.3" y2="217.2" />
  </g>
  <!-- 環型: A, the wall, from the outer edge at upper right to the bore. -->
  <line x1="110" y1="150.4" x2="98" y2="157.2" stroke="#000" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">
    <text x="69" y="19.5">E</text>
    <text x="86.3" y="69.4">B</text>
    <text x="16" y="93.8">A</text>
    <text x="96.3" y="116.3">C</text>
    <text x="174.5" y="53.7">D</text>
    <text x="25.5" y="165.3">C1</text>
    <text x="74.6" y="165.7">B1</text>
    <text x="99.8" y="148.3">A</text>
    <text x="132.7" y="155.5">D</text>
    <text x="83.4" y="202.1">B2</text>
    <text x="83.4" y="227.1">C2</text>
  </g>
  <g font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#000">
    <text x="142.8" y="110">C型</text>
    <text x="142.8" y="254">環型</text>
  </g>
</svg>
