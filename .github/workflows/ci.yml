name: Portfolio CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workflow_demo_test
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: public-demo-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow_demo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgres://workflow:public-demo-test@127.0.0.1:5432/workflow_demo_test
      TEST_DATABASE_URL: postgres://workflow:public-demo-test@127.0.0.1:5432/workflow_demo_test
      DEMO_TEST_DATABASE_URL: postgres://workflow:public-demo-test@127.0.0.1:5432/workflow_demo_fixture_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm publication:audit
      - run: pnpm audit --prod --audit-level high
      - run: pnpm ops:test
      - run: pnpm ops:validate-example
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm db:verify
      - run: pnpm db:verify-runtime
      - name: Prepare isolated optional-demo fixture database
        env:
          PGPASSWORD: public-demo-test
        run: |
          createdb --host=127.0.0.1 --username=workflow workflow_demo_fixture_test
          DATABASE_URL="$DEMO_TEST_DATABASE_URL" pnpm db:migrate
          DATABASE_URL="$DEMO_TEST_DATABASE_URL" pnpm db:seed
      - run: pnpm test
      - run: pnpm build:web
      - run: pnpm --filter @workflow/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  branding:
    if: github.event.repository.private == false
    runs-on: windows-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @workflow/web exec playwright install chromium
      - run: pnpm test:branding

  containers:
    if: github.event.repository.private == false
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/api.Dockerfile -t workflow/api:ci .
      - run: docker run --rm --init --workdir /app/apps/api --entrypoint node workflow/api:ci -e "import('playwright').then(async ({chromium}) => {const browser = await chromium.launch({headless:true,args:['--disable-dev-shm-usage']}); await browser.close();})"
      - run: docker build -f docker/web.Dockerfile -t workflow/web:ci .
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/operations/web-container-smoke.mjs workflow/web:ci
      - run: docker build -f docker/worker.Dockerfile -t workflow/worker:ci .
